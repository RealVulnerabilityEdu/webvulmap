name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools
          pip-compile curriculum/requirements.in > curriculum/requirements.txt
          if [ -f curriculum/requirements.txt ]; then pip install -r curriculum/requirements.txt; fi
      - name: Test with pytest
        run: |
          PYTHONPATH=src pytest
